<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style type="text/css">
        html, body {
            color: #BEBEBE;
            background-color: #1D1D1D;
            font-family: "DM Mono", Consolas, "Cascadia Mono", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
            padding: 4px;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #DEDEDE;
            font-weight: 600;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }

        h1 { font-size: 1.4em; border-bottom: 1px solid #303030; padding-bottom: 4px; }
        h2 { font-size: 1.2em; }
        h3 { font-size: 1.1em; }

        a {
            color: #1DBEC5;
            text-decoration: none;
        }
        a:hover {
            color: #B396E8;
            text-decoration: underline;
        }

        code, pre {
            font-family: Consolas, "Cascadia Mono", monospace;
            background: #141414;
            border: 1px solid #303030;
            border-radius: 0;
            color: #DEDEDE;
        }

        code {
            padding: 1px 4px;
        }

        pre {
            padding: 10px;
            overflow-x: auto;
        }

        blockquote {
            border-left: 3px solid #B396E8;
            background: #202020;
            margin: 8px 0;
            padding: 8px 12px;
            color: #BEBEBE;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            border: 1px solid #303030;
        }

        th, td {
            border: 1px solid #303030;
            padding: 6px 10px;
            text-align: left;
        }

        th {
            background-color: #242424;
            color: #DEDEDE;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #1A1A1A;
        }

        img {
            max-width: 100%;
            border: 1px solid #303030;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: #303030;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B396E8;
        }
    </style>
    <title>Game Description</title>
</head>
<body>
<div>
{text}
</div>
</body>
</html>
